  test_dir: tests
  infra_dirs:
    docker: docker/
    k8s: k8s/
    terraform: infra/terraform/
  doc_dirs:
    design_docs: architecture/
    markdown: project/
  prefers_monorepo: false
  prefers_submodules: true
