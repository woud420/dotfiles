name: Test install.sh

on:
  push:
    branches: [main, "feature/*", "fix/*"]
  pull_request:
    branches: [main]

jobs:
  # Fast syntax/parse checks that don't need install.sh
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax check (bash -n)
        run: |
          echo "=== Checking shell configs ==="
          bash -n common/shell/.bashrc && echo "PASS: .bashrc"
          bash -n common/shell/.bashrc.server && echo "PASS: .bashrc.server"

          echo "=== Checking shell functions ==="
          fail=0
          for f in common/shell-functions/*.sh; do
            bash -n "$f" && echo "PASS: $(basename $f)" || { echo "FAIL: $(basename $f)"; fail=1; }
          done

          echo "=== Checking scripts ==="
          for f in scripts/*.sh; do
            bash -n "$f" && echo "PASS: $(basename $f)" || { echo "FAIL: $(basename $f)"; fail=1; }
          done
          exit $fail

      - name: Zsh syntax check
        run: |
          sudo apt-get install -y zsh
          zsh -n common/shell/.zshrc && echo "PASS: .zshrc"

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./common/shell-functions
          severity: error

      - name: Git config parse check
        run: |
          git config --file common/git/.gitconfig --list > /dev/null
          echo "PASS: .gitconfig parses ($(git config --file common/git/.gitconfig --get-regexp '^alias\.' | wc -l) aliases found)"

      - name: Vim CoC settings JSON validation
        run: |
          python3 -c "import json; json.load(open('.vim/coc-settings.json'))" && echo "PASS: coc-settings.json"

      - name: install.sh syntax check
        run: bash -n install.sh && echo "PASS: install.sh"

  test-arch:
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git zsh vim fzf sudo kitty tmux \
            ttf-firacode-nerd python nodejs npm curl

      - name: Create test user
        run: |
          useradd -m -s /bin/zsh testuser
          echo "testuser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Run install.sh
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/testuser/dotfiles
          chown -R testuser:testuser /home/testuser/dotfiles
          su testuser -c "cd /home/testuser/dotfiles && ./install.sh --no-packages 2>&1" | tee /tmp/install.log

      - name: Verify file deployments
        run: |
          su testuser -c '
            set -e
            echo "=== Symlinks ==="
            for f in .bashrc .zshrc .gitconfig .tmux.conf .inputrc .gdbinit; do
              test -L ~/$f && echo "PASS: $f -> $(readlink ~/$f)" || { echo "FAIL: $f not symlinked"; exit 1; }
            done
            for f in .vim/vimrc .vim/plugins.vim .vim/mappings.vim .vim/settings.vim; do
              test -L ~/$f && echo "PASS: $f" || { echo "FAIL: $f not symlinked"; exit 1; }
            done

            echo "=== Copies ==="
            for f in .gnu_aliases .dircolors; do
              test -f ~/$f && ! test -L ~/$f && echo "PASS: $f (copied)" || { echo "FAIL: $f"; exit 1; }
            done
            ls ~/.config/shell-functions/*.sh > /dev/null && echo "PASS: shell-functions deployed"

            echo "=== Kitty ==="
            test -f ~/.config/kitty/kitty.conf && echo "PASS: kitty.conf"
            test -f ~/.config/kitty/current-theme.conf && echo "PASS: current-theme.conf"
          '

      - name: Validate Kitty config (headless parse)
        run: |
          su testuser -c '
            kitty +runpy "
import sys
from kitty.config import load_config
bad = []
opts = load_config(\"$HOME/.config/kitty/kitty.conf\", accumulate_bad_lines=bad)
if bad:
    for b in bad:
        print(f\"ERROR line {b.number}: {b.line!r} -> {b.exception}\")
    sys.exit(1)
print(f\"PASS: kitty.conf parsed\")
print(f\"  font_family: {opts.font_family}\")
print(f\"  font_size: {opts.font_size}\")
print(f\"  background_opacity: {opts.background_opacity}\")
print(f\"  cursor_shape: {opts.cursor_shape}\")
"
          '

      - name: Verify Kitty theme is Linux purple
        run: |
          su testuser -c '
            grep -q "Custom Purple" ~/.config/kitty/current-theme.conf && echo "PASS: Linux purple theme"
            grep -q "background.*#221820" ~/.config/kitty/current-theme.conf && echo "PASS: bg=#221820"
            grep -q "foreground.*#d0d0d0" ~/.config/kitty/current-theme.conf && echo "PASS: fg=#d0d0d0"
            grep -q "#9d5a7f" ~/.config/kitty/current-theme.conf && echo "PASS: accent=#9d5a7f"
          '

      - name: Verify font installed and resolved
        run: |
          fc-list -q "FiraCode Nerd Font" && echo "PASS: FiraCode Nerd Font installed" || { echo "FAIL: font not found"; exit 1; }
          matched=$(fc-match "FiraCode Nerd Font" --format='%{family}')
          echo "$matched" | grep -qi "FiraCode" && echo "PASS: fc-match resolves to $matched" || { echo "FAIL: resolved to $matched"; exit 1; }

      - name: Validate Vim config (headless load)
        run: |
          su testuser -c '
            # Bootstrap vim-plug
            curl -fLo ~/.vim/autoload/plug.vim --create-dirs \
              https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim

            # Load vimrc in ex mode (NOT -es, which breaks line continuations)
            output=$(vim -e -N -u ~/.vim/vimrc --not-a-term -c "qa!" 2>&1)
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "PASS: vimrc loaded without errors"
            else
              echo "FAIL: vimrc load errors:"
              echo "$output"
              exit 1
            fi

            # Install plugins
            vim -e -N -u ~/.vim/vimrc --not-a-term -c "PlugInstall --sync" -c "qa!" 2>&1
            echo "PASS: vim-plug PlugInstall completed"
          '

      - name: Validate tmux config (headless)
        run: |
          su testuser -c '
            tmux -L ci_test -f ~/.tmux.conf new-session -d "true" 2>&1
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "PASS: tmux config loaded"
              echo "  Settings:"
              tmux -L ci_test show-options -g 2>/dev/null | head -10
              tmux -L ci_test kill-server 2>/dev/null
            else
              echo "FAIL: tmux config error (exit $rc)"
              exit 1
            fi
          '

      - name: Validate git config
        run: |
          su testuser -c '
            git config --file ~/.gitconfig --list > /dev/null 2>&1 && echo "PASS: .gitconfig" || { echo "FAIL: .gitconfig"; exit 1; }
            count=$(git config --file ~/.gitconfig --get-regexp "^alias\." | wc -l)
            echo "  $count git aliases loaded"
          '

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p /tmp/evidence
          su testuser -c '
            echo "--- Deployed files ---" > /tmp/evidence/report.txt
            ls -la ~/.bashrc ~/.zshrc ~/.gitconfig ~/.tmux.conf ~/.inputrc ~/.gdbinit 2>&1 >> /tmp/evidence/report.txt
            echo "" >> /tmp/evidence/report.txt
            echo "--- Kitty config ---" >> /tmp/evidence/report.txt
            cat ~/.config/kitty/kitty.conf >> /tmp/evidence/report.txt
            echo "" >> /tmp/evidence/report.txt
            echo "--- Kitty theme (first 10 lines) ---" >> /tmp/evidence/report.txt
            head -10 ~/.config/kitty/current-theme.conf >> /tmp/evidence/report.txt
            echo "" >> /tmp/evidence/report.txt
            echo "--- Font check ---" >> /tmp/evidence/report.txt
            fc-list | grep -i fira >> /tmp/evidence/report.txt 2>&1
            echo "" >> /tmp/evidence/report.txt
            echo "--- Git aliases ---" >> /tmp/evidence/report.txt
            git config --file ~/.gitconfig --get-regexp "^alias\." >> /tmp/evidence/report.txt 2>&1
            echo "" >> /tmp/evidence/report.txt
            echo "--- Shell functions ---" >> /tmp/evidence/report.txt
            ls ~/.config/shell-functions/ >> /tmp/evidence/report.txt 2>&1
            echo "" >> /tmp/evidence/report.txt
            echo "--- Vim plugins ---" >> /tmp/evidence/report.txt
            ls ~/.vim/plugged/ >> /tmp/evidence/report.txt 2>&1
          '
          cp /tmp/install.log /tmp/evidence/ 2>/dev/null || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-arch
          path: /tmp/evidence/

  test-debian:
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y git zsh vim sudo curl tmux python3 fontconfig

      - name: Create test user
        run: |
          useradd -m -s /bin/zsh testuser
          echo "testuser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Run install.sh
        run: |
          cp -r "$GITHUB_WORKSPACE" /home/testuser/dotfiles
          chown -R testuser:testuser /home/testuser/dotfiles
          su testuser -c "cd /home/testuser/dotfiles && ./install.sh --no-packages 2>&1" | tee /tmp/install.log

      - name: Verify file deployments
        run: |
          su testuser -c '
            set -e
            echo "=== Symlinks ==="
            for f in .bashrc .zshrc .gitconfig .tmux.conf .inputrc; do
              test -L ~/$f && echo "PASS: $f -> $(readlink ~/$f)" || { echo "FAIL: $f not symlinked"; exit 1; }
            done

            echo "=== Copies ==="
            test -f ~/.gnu_aliases && ! test -L ~/.gnu_aliases && echo "PASS: .gnu_aliases (copied)"
            test -f ~/.dircolors && ! test -L ~/.dircolors && echo "PASS: .dircolors (copied)"

            echo "=== Kitty ==="
            test -f ~/.config/kitty/kitty.conf && echo "PASS: kitty.conf"
            test -f ~/.config/kitty/current-theme.conf && echo "PASS: current-theme.conf"
            grep -q "Custom Purple" ~/.config/kitty/current-theme.conf && echo "PASS: Linux purple theme"
          '

      - name: Validate shell configs
        run: |
          su testuser -c '
            bash -n ~/.bashrc && echo "PASS: .bashrc syntax"
            zsh -n ~/.zshrc && echo "PASS: .zshrc syntax"
            for f in ~/.config/shell-functions/*.sh; do
              bash -n "$f" && echo "PASS: $(basename $f)" || { echo "FAIL: $(basename $f)"; exit 1; }
            done
          '

      - name: Validate tmux config
        run: |
          su testuser -c '
            tmux -L ci_test -f ~/.tmux.conf new-session -d "true" 2>&1
            if [ $? -eq 0 ]; then
              echo "PASS: tmux config loaded"
              tmux -L ci_test kill-server 2>/dev/null
            else
              echo "FAIL: tmux config error"
              exit 1
            fi
          '

      - name: Validate Vim config
        run: |
          su testuser -c '
            curl -fLo ~/.vim/autoload/plug.vim --create-dirs \
              https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
            vim -e -N -u ~/.vim/vimrc --not-a-term -c "qa!" 2>&1
            [ $? -eq 0 ] && echo "PASS: vimrc loaded" || { echo "FAIL: vimrc errors"; exit 1; }
          '

      - name: Validate git config
        run: |
          su testuser -c '
            git config --file ~/.gitconfig --list > /dev/null 2>&1 && echo "PASS: .gitconfig" || { echo "FAIL"; exit 1; }
          '

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cp /tmp/install.log /tmp/evidence/ 2>/dev/null || true
          su testuser -c '
            ls -la ~/.bashrc ~/.zshrc ~/.gitconfig ~/.tmux.conf ~/.inputrc 2>&1 > /tmp/evidence/report.txt
            head -10 ~/.config/kitty/current-theme.conf >> /tmp/evidence/report.txt
          '

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-debian
          path: /tmp/evidence/

  test-macos:
    runs-on: macos-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install vim tmux

      - name: Run install.sh
        run: ./install.sh --no-packages 2>&1 | tee /tmp/install.log

      - name: Verify file deployments
        run: |
          set -e
          echo "=== Symlinks ==="
          for f in .bashrc .zshrc .gitconfig .tmux.conf .inputrc .gdbinit; do
            test -L ~/$f && echo "PASS: $f -> $(readlink ~/$f)" || { echo "FAIL: $f not symlinked"; exit 1; }
          done

          echo "=== Copies ==="
          test -f ~/.gnu_aliases && ! test -L ~/.gnu_aliases && echo "PASS: .gnu_aliases (copied)"
          test -f ~/.dircolors && ! test -L ~/.dircolors && echo "PASS: .dircolors (copied)"

          echo "=== Kitty ==="
          test -f ~/.config/kitty/kitty.conf && echo "PASS: kitty.conf"
          test -f ~/.config/kitty/current-theme.conf && echo "PASS: current-theme.conf"
          grep -q "Catppuccin-Mocha" ~/.config/kitty/current-theme.conf && echo "PASS: macOS Catppuccin Mocha theme"
          grep -q "FiraCode" ~/.config/kitty/kitty.conf && echo "PASS: FiraCode font (macOS)"

      - name: Validate Vim config
        run: |
          curl -fLo ~/.vim/autoload/plug.vim --create-dirs \
            https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
          output=$(vim -e -N -u ~/.vim/vimrc --not-a-term -c "qa!" 2>&1)
          [ $? -eq 0 ] && echo "PASS: vimrc loaded" || { echo "FAIL: $output"; exit 1; }
          vim -e -N -u ~/.vim/vimrc --not-a-term -c "PlugInstall --sync" -c "qa!" 2>&1
          echo "PASS: vim-plug PlugInstall completed"

      - name: Validate tmux config
        run: |
          tmux -L ci_test -f ~/.tmux.conf new-session -d "true" 2>&1
          if [ $? -eq 0 ]; then
            echo "PASS: tmux config loaded"
            tmux -L ci_test show-options -g | head -10
            tmux -L ci_test kill-server 2>/dev/null
          else
            echo "FAIL: tmux config error"
            exit 1
          fi

      - name: Validate git config
        run: |
          git config --file ~/.gitconfig --list > /dev/null 2>&1 && echo "PASS: .gitconfig" || { echo "FAIL"; exit 1; }
          echo "  $(git config --file ~/.gitconfig --get-regexp '^alias\.' | wc -l) git aliases loaded"

      - name: Collect evidence
        if: always()
        run: |
          mkdir -p /tmp/evidence
          cp /tmp/install.log /tmp/evidence/ 2>/dev/null || true
          ls -la ~/.bashrc ~/.zshrc ~/.gitconfig ~/.tmux.conf ~/.inputrc ~/.gdbinit > /tmp/evidence/report.txt 2>&1
          head -10 ~/.config/kitty/current-theme.conf >> /tmp/evidence/report.txt
          echo "--- Vim plugins ---" >> /tmp/evidence/report.txt
          ls ~/.vim/plugged/ >> /tmp/evidence/report.txt 2>&1
          echo "--- Git aliases ---" >> /tmp/evidence/report.txt
          git config --file ~/.gitconfig --get-regexp '^alias\.' >> /tmp/evidence/report.txt 2>&1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-macos
          path: /tmp/evidence/
