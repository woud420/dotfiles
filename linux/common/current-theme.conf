# vim:ft=kitty

## name:     Custom Purple (Sway Desktop Match)
## author:   local
## blurb:    Warm purple/burgundy theme matching Sway, Waybar, Rofi, and Mako


# The basic colors
foreground              #d0d0d0
background              #221820
selection_foreground    #221820
selection_background    #9d5a7f

# Cursor colors
cursor                  #d0d0d0
cursor_text_color       #221820

# URL underline color when hovering with mouse
url_color               #9d5a7f

# Kitty window border colors
active_border_color     #9d5a7f
inactive_border_color   #4a3844
bell_border_color       #d68787

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
